<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>مدیریت محصولات</title>


              <link rel="stylesheet"
          href="assets/css/admin.css">

</head>

<body>



<div class="container mt-5">

    <h2 class="mb-4">
        مدیریت محصولات
    </h2>

    <div class="mb-3">

    <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="جستجوی محصول..."
    >

</div>

<select id="filterCategory" class="form-select mb-3">

    <option value="">همه دسته‌بندی‌ها</option>

    <option value="لامپ">لامپ</option>

    <option value="کلید و پریز">کلید و پریز</option>

    <option value="محافظ ولتاژ">محافظ ولتاژ</option>

    <option value="کابل و سیم">کابل و سیم</option>

</select>


<select id="sortProducts">

    <option value="">مرتب سازی بر اساس:</option>

    <option value="price-asc">
        ارزان‌ترین
    </option>

    <option value="price-desc">
        گران‌ترین
    </option>

    <option value="rating-desc">
        بیشترین امتیاز
    </option>

</select>


<form id="productForm" class="mb-5">

    <input
        id="title"
        class="form-control mb-3"
        placeholder="عنوان محصول">


        <select
    id="category"
    class="form-select mb-3">

    <option value="">
        انتخاب دسته بندی
    </option>

    <option value="لامپ">
        لامپ
    </option>

    <option value="کلید و پریز">
        کلید و پریز
    </option>

    <option value="محافظ ولتاژ">
        محافظ ولتاژ
    </option>

    <option value="کابل و سیم">
        کابل و سیم
    </option>

</select>


<select
    id="brand"
    class="form-select mb-3">

    <option value="">
        انتخاب برند
    </option>

    <option value="پارس شهاب">
        پارس شهاب
    </option>

        <option value="افرا تاب">
       افرا تاب
    </option>

    <option value="بروکس">
        بروکس
    </option>

    <option value="ایران الکتریک">
        ایران الکتریک
    </option>

<option value="ویرا">
        ویرا
    </option>

        <option value="افشارنژاد">
        افشارنژاد
    </option>

        <option value="سیمیا">
        سیمیا
    </option>

        <option value="مغان">
        مغان
    </option>

    <option value="دلند">
        دلند
    </option>

    <option value="پارت">
        پارت
    </option>

    <option value="البرز">
        البرز
    </option>

</select>



    <input
        id="price"
        type="number"
        class="form-control mb-3"
        placeholder="قیمت">

    <input
        id="rating"
        type="number"
        step="0.1"
        class="form-control mb-3"
        placeholder="امتیاز">

    <input
        id="image"
        class="form-control mb-3"
        placeholder="آدرس تصویر">

    <button
        class="btn btn-primary">

        ثبت محصول

    </button>

</form>



    <table class="table">

        <thead>

            <tr>

                <th>تصویر</th>

                <th>عنوان</th>

                <th>قیمت</th>

                <th>برند</th>

                <th>عملیات</th>

            </tr>

        </thead>

        <tbody id="productsTable">

        </tbody>

    </table>

</div>



<div id="pagination"></div>

<div id="loader" class="loader hidden"></div>

<div id="toast" class="toast-message"></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/admin.js"></script>

</body>

</html>
